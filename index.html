<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drzewo genealogiczne</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>tailwind.config = { theme: { extend: { colors: { page: '#f4f7f9' } } } };</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
  #viewport { touch-action: none; cursor: grab; user-select: none; }
  #stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
</style>
</head>
<body class="bg-page text-slate-800 min-h-screen">

<!-- Logowanie -->
<main id="loginView" class="hidden max-w-sm mx-auto px-4 py-16">
  <div class="bg-white border border-slate-200 rounded-xl shadow-sm p-6 space-y-4">
    <h1 class="text-2xl font-semibold">Drzewo genealogiczne</h1>
    <p id="cfgWarn" class="hidden text-sm text-amber-600">Uzupełnij SUPABASE_URL i SUPABASE_KEY na górze skryptu.</p>
    <form id="loginForm" class="space-y-3">
      <label class="block"><span class="text-xs font-medium text-slate-600">E-mail</span>
        <input name="email" type="email" required class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600"></label>
      <label class="block"><span class="text-xs font-medium text-slate-600">Hasło</span>
        <input name="password" type="password" required class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600"></label>
      <p id="loginErr" class="text-sm text-red-600"></p>
      <button class="w-full rounded-lg px-4 py-2 text-sm font-medium bg-blue-600 text-white hover:bg-blue-700">Zaloguj</button>
    </form>
  </div>
</main>

<!-- Aplikacja -->
<main id="appView" class="hidden max-w-7xl mx-auto px-4 py-8 space-y-6">
  <header class="flex items-center justify-between gap-3 flex-wrap">
    <div class="flex items-center gap-3">
      <a id="hubLink" title="Hub" class="p-2 rounded-lg border border-slate-300 bg-white hover:bg-slate-50 text-slate-600">
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="4" height="4"/><rect x="10" y="4" width="4" height="4"/><rect x="16" y="4" width="4" height="4"/><rect x="4" y="10" width="4" height="4"/><rect x="10" y="10" width="4" height="4"/><rect x="16" y="10" width="4" height="4"/><rect x="4" y="16" width="4" height="4"/><rect x="10" y="16" width="4" height="4"/><rect x="16" y="16" width="4" height="4"/></svg>
      </a>
      <h1 class="text-2xl font-semibold">Drzewo genealogiczne</h1>
    </div>
    <div class="flex gap-2">
      <button id="btnAdd" class="rounded-lg px-4 py-2 text-sm font-medium bg-blue-600 text-white hover:bg-blue-700">+ Dodaj osobę</button>
      <button id="btnLogout" class="rounded-lg px-4 py-2 text-sm font-medium bg-white border border-slate-300 text-slate-700 hover:bg-slate-50">Wyloguj</button>
    </div>
  </header>

  <div class="bg-white border border-slate-200 rounded-xl shadow-sm p-4 flex flex-wrap items-center gap-3">
    <div class="relative flex-1 min-w-[200px]">
      <input id="search" type="search" placeholder="Szukaj osoby…" autocomplete="off" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600">
      <div id="results" class="hidden absolute z-20 left-0 right-0 mt-1 bg-white border border-slate-200 rounded-lg shadow-lg overflow-hidden"></div>
    </div>
    <span id="stats" class="text-xs text-slate-500"></span>
    <p id="msg" class="text-sm text-red-600 w-full"></p>
  </div>

  <div id="viewport" class="relative overflow-hidden h-[70vh] bg-white border border-slate-200 rounded-xl shadow-sm">
    <div id="stage"></div>
    <div id="empty" data-ui class="hidden absolute inset-0 flex items-center justify-center p-4">
      <div class="bg-slate-50 border border-slate-200 rounded-xl p-6 text-center text-sm text-slate-500">Brak osób w drzewie. Dodaj pierwszą osobę.</div>
    </div>
    <div data-ui class="absolute right-3 top-3 flex flex-col gap-2">
      <button id="zIn" title="Przybliż" class="w-9 h-9 rounded-lg bg-white border border-slate-300 hover:bg-slate-50 text-lg leading-none">+</button>
      <button id="zOut" title="Oddal" class="w-9 h-9 rounded-lg bg-white border border-slate-300 hover:bg-slate-50 text-lg leading-none">−</button>
      <button id="zFit" title="Dopasuj" class="w-9 h-9 rounded-lg bg-white border border-slate-300 hover:bg-slate-50 flex items-center justify-center text-slate-600">
        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
    </div>
  </div>
</main>

<!-- Modal -->
<div id="modal" class="hidden fixed inset-0 z-50 bg-slate-900/40 flex items-center justify-center p-4">
  <div id="modalBody" class="bg-white border border-slate-200 rounded-xl shadow-sm p-6 w-full max-w-lg max-h-[90vh] overflow-y-auto"></div>
</div>

<script>
// ===== Konfiguracja =====
const SUPABASE_URL = 'https://TWOJ-PROJEKT.supabase.co';
const SUPABASE_KEY = 'TWOJ-ANON-KEY';
const HUB_URL = 'https://kamilowebski.github.io/hub/';
const CARD_W = 168, CARD_H = 56, PARTNER_GAP = 12, GAP_X = 24;
const ROW_H = 150, FAMILY_GAP = 80, PAD = 110, TOP = 40;
const BTN = 'rounded-lg px-4 py-2 text-sm font-medium bg-blue-600 text-white hover:bg-blue-700';
const BTN2 = 'rounded-lg px-4 py-2 text-sm font-medium bg-white border border-slate-300 text-slate-700 hover:bg-slate-50';
const BTN_DEL = 'rounded-lg px-4 py-2 text-sm font-medium bg-red-600 text-white hover:bg-red-700';
const INP = 'w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-600';

// ===== Stan =====
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let db, signed = false, persons = [], unions = [], byId = new Map(), children = new Map();
let last = null, dims = { W: 0, H: 0 }, view = { x: 0, y: 0, k: 1 }, firstFit = true;

// ===== Pomocnicze =====
const yr = s => (String(s || '').match(/\d{4}/) || [''])[0];
const name = p => [p.first_name, p.last_name].filter(Boolean).join(' ') || 'Nieznana osoba';
const years = p => { const b = yr(p.birth_date), d = yr(p.death_date); return b || d ? (b || '?') + (d ? ' – ' + d : '') : ''; };
const byName = (a, b) => name(a).localeCompare(name(b), 'pl');
const byBirth = (a, b) => (yr(a.birth_date) || '9999').localeCompare(yr(b.birth_date) || '9999') || byName(a, b);
const hasParents = p => [p.father_id, p.mother_id].some(i => byId.has(i));
function setMsg(t) { $('#msg').textContent = t || ''; if (t) setTimeout(() => { $('#msg').textContent = ''; }, 6000); }
function descendants(id, set = new Set()) {
  (children.get(id) || []).forEach(c => { if (!set.has(c.id)) { set.add(c.id); descendants(c.id, set); } });
  return set;
}

// ===== Logowanie / dane =====
$('#hubLink').href = HUB_URL;
if (SUPABASE_URL.includes('TWOJ')) {
  $('#loginView').classList.remove('hidden'); $('#cfgWarn').classList.remove('hidden');
} else {
  db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  db.auth.onAuthStateChange((_e, s) => setSession(s));
}
function setSession(s) {
  const on = !!s; if (on === signed && !firstFit) return;
  signed = on;
  $('#loginView').classList.toggle('hidden', on);
  $('#appView').classList.toggle('hidden', !on);
  if (on) load(); else if (!on) $('#loginView').classList.remove('hidden');
}
$('#loginForm').onsubmit = async e => {
  e.preventDefault();
  const f = new FormData(e.target);
  const { error } = await db.auth.signInWithPassword({ email: f.get('email'), password: f.get('password') });
  $('#loginErr').textContent = error ? 'Nieprawidłowy e-mail lub hasło.' : '';
};
$('#btnLogout').onclick = () => db.auth.signOut();

async function load() {
  const [p, u] = await Promise.all([db.from('persons').select('*'), db.from('unions').select('*')]);
  if (p.error || u.error) return setMsg('Błąd pobierania danych: ' + (p.error || u.error).message);
  persons = p.data; unions = u.data;
  byId = new Map(persons.map(x => [x.id, x]));
  children = new Map();
  persons.forEach(c => new Set([c.father_id, c.mother_id]).forEach(i => { if (i) { if (!children.has(i)) children.set(i, []); children.get(i).push(c); } }));
  render();
  if (firstFit) { fit(); firstFit = false; }
}

// ===== Układ drzewa =====
function computeLayout() {
  // partnerzy: jawne związki + wspólne dzieci
  const partners = new Map(persons.map(p => [p.id, new Set()]));
  const link = (a, b) => { if (a && b && a !== b && partners.has(a) && partners.has(b)) { partners.get(a).add(b); partners.get(b).add(a); } };
  unions.forEach(u => link(u.person_a, u.person_b));
  persons.forEach(p => link(p.father_id, p.mother_id));

  // pokolenia: dziecko poniżej rodziców, partnerzy w tym samym rzędzie
  const gen = new Map(persons.map(p => [p.id, 0]));
  for (let i = 0; i < persons.length + 2; i++) {
    let ch = false;
    persons.forEach(p => {
      [p.father_id, p.mother_id].forEach(pid => {
        if (gen.has(pid) && gen.get(p.id) < gen.get(pid) + 1) { gen.set(p.id, gen.get(pid) + 1); ch = true; }
      });
      partners.get(p.id).forEach(q => { if (gen.get(q) < gen.get(p.id)) { gen.set(q, gen.get(p.id)); ch = true; } });
    });
    if (!ch) break;
  }

  // budowa jednostek (osoba + partnerzy) z potomkami
  const placed = new Set();
  function build(p) {
    const members = [p]; placed.add(p.id);
    partners.get(p.id).forEach(q => { if (!placed.has(q)) { placed.add(q); members.push(byId.get(q)); } });
    const kids = [...new Map(members.flatMap(m => children.get(m.id) || []).map(c => [c.id, c])).values()].sort(byBirth);
    const nodes = [];
    kids.forEach(c => { if (!placed.has(c.id)) nodes.push(build(c)); });
    const own = members.length * CARD_W + (members.length - 1) * PARTNER_GAP;
    const kw = nodes.reduce((s, n) => s + n.w, 0) + Math.max(0, nodes.length - 1) * GAP_X;
    return { members, nodes, own, kw, w: Math.max(own, kw) };
  }
  const pos = new Map();
  function place(n, left) {
    let x = left + (n.w - n.own) / 2;
    n.members.forEach(m => { pos.set(m.id, { x, y: TOP + gen.get(m.id) * ROW_H }); x += CARD_W + PARTNER_GAP; });
    let cx = left + (n.w - n.kw) / 2;
    n.nodes.forEach(c => { place(c, cx); cx += c.w + GAP_X; });
  }
  // korzenie: osoby bez rodziców; te, których partner ma rodziców, na końcu
  const score = p => [...partners.get(p.id)].some(q => hasParents(byId.get(q))) ? 1 : 0;
  const roots = persons.filter(p => !hasParents(p)).sort((a, b) => score(a) - score(b) || byBirth(a, b));
  let left = PAD;
  [...roots, ...persons].forEach(p => {
    if (placed.has(p.id)) return;
    const n = build(p); place(n, left); left += n.w + FAMILY_GAP;
  });
  return { pos, gen, partners };
}

// ===== Rysowanie =====
function render() {
  const L = computeLayout(); last = L;
  const { pos, gen, partners } = L;
  $('#empty').classList.toggle('hidden', persons.length > 0);
  $('#stats').textContent = persons.length + ' os. · ' + (new Set(gen.values()).size) + ' pokoleń';
  const maxX = Math.max(0, ...[...pos.values()].map(p => p.x)) + CARD_W + PAD;
  const maxGen = Math.max(0, ...gen.values());
  const W = maxX, H = TOP * 2 + maxGen * ROW_H + CARD_H;
  dims = { W, H };

  let s = `<svg width="${W}" height="${H}" class="absolute left-0 top-0 pointer-events-none" fill="none">`;
  let lbl = '';
  for (let g = 0; g <= maxGen; g++) {
    const cy = TOP + g * ROW_H + CARD_H / 2;
    s += `<line x1="0" x2="${W}" y1="${cy}" y2="${cy}" stroke="#eef2f6"/>`;
    lbl += `<div class="absolute text-xs font-medium text-slate-400" style="left:10px;top:${cy - 8}px">Pokolenie ${g + 1}</div>`;
  }
  const st = 'stroke="#94a3b8" stroke-width="2" stroke-linejoin="round"';
  // linie rodzic → dziecko
  persons.forEach(c => {
    const ps = [c.father_id, c.mother_id].filter(id => pos.has(id));
    if (!ps.length || !pos.has(c.id)) return;
    const cp = pos.get(c.id), cx = cp.x + CARD_W / 2, my = cp.y - (ROW_H - CARD_H) / 2;
    const a = ps.map(id => pos.get(id));
    const adj = a.length === 2 && a[0].y === a[1].y && Math.abs(a[0].x - a[1].x) === CARD_W + PARTNER_GAP;
    if (adj) {
      const ax = Math.min(a[0].x, a[1].x) + CARD_W + PARTNER_GAP / 2, ay = a[0].y + CARD_H / 2;
      s += `<path d="M${ax} ${ay}V${my}H${cx}V${cp.y}" ${st}/>`;
    } else {
      a.forEach(q => { s += `<path d="M${q.x + CARD_W / 2} ${q.y + CARD_H}V${my}H${cx}V${cp.y}" ${st}/>`; });
    }
  });
  // linie partnerów
  partners.forEach((set, id) => set.forEach(q => {
    if (id > q || !pos.has(id) || !pos.has(q)) return;
    const a = pos.get(id), b = pos.get(q);
    if (a.y === b.y && Math.abs(a.x - b.x) === CARD_W + PARTNER_GAP) {
      const l = a.x < b.x ? a : b;
      s += `<path d="M${l.x + CARD_W} ${l.y + CARD_H / 2}h${PARTNER_GAP}" ${st}/>`;
    } else {
      const y1 = a.y + CARD_H, y2 = y1 + 14;
      s += `<path d="M${a.x + CARD_W / 2} ${y1}V${y2}H${b.x + CARD_W / 2}V${b.y + CARD_H}" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4"/>`;
    }
  }));
  s += '</svg>';

  let cards = '';
  persons.forEach(p => {
    const q = pos.get(p.id); if (!q) return;
    const bc = p.gender === 'M' ? 'border-l-sky-400' : p.gender === 'K' ? 'border-l-pink-400' : 'border-l-slate-300';
    const full = name(p) + (p.maiden_name ? ` (${p.maiden_name})` : '');
    cards += `<button data-id="${esc(p.id)}" title="${esc(full)}" class="card absolute text-left bg-white border border-slate-200 border-l-4 ${bc} rounded-xl shadow-sm hover:shadow-md px-3 py-2 overflow-hidden" style="left:${q.x}px;top:${q.y}px;width:${CARD_W}px;height:${CARD_H}px">
      <div class="text-sm font-semibold truncate">${esc(full)}</div><div class="text-xs text-slate-500 truncate">${esc(years(p)) || '&nbsp;'}</div></button>`;
  });
  const stage = $('#stage');
  stage.style.width = W + 'px'; stage.style.height = H + 'px';
  stage.innerHTML = s + lbl + cards;
  applyView();
}

// ===== Widok: przesuwanie i zoom =====
const vp = $('#viewport'); const ptrs = new Map(); let lastDist = 0, moved = 0;
function applyView() { $('#stage').style.transform = `translate(${view.x}px,${view.y}px) scale(${view.k})`; }
function zoomAt(cx, cy, f) {
  const r = vp.getBoundingClientRect(), px = cx - r.left, py = cy - r.top;
  const nk = Math.min(2, Math.max(0.1, view.k * f)), r2 = nk / view.k;
  view.x = px - (px - view.x) * r2; view.y = py - (py - view.y) * r2; view.k = nk; applyView();
}
function fit() {
  const k = Math.min(1, vp.clientWidth / dims.W, vp.clientHeight / dims.H) || 1;
  view = { k, x: (vp.clientWidth - dims.W * k) / 2, y: Math.max(0, (vp.clientHeight - dims.H * k) / 2) };
  applyView();
}
vp.addEventListener('pointerdown', e => {
  if (e.target.closest('[data-ui]')) return;
  if (!ptrs.size) moved = 0;
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
});
window.addEventListener('pointermove', e => {
  const p = ptrs.get(e.pointerId); if (!p) return;
  const px = p.x, py = p.y; p.x = e.clientX; p.y = e.clientY;
  if (ptrs.size === 1) {
    view.x += p.x - px; view.y += p.y - py; moved += Math.abs(p.x - px) + Math.abs(p.y - py); applyView();
  } else if (ptrs.size === 2) {
    const [a, b] = [...ptrs.values()], d = Math.hypot(a.x - b.x, a.y - b.y);
    if (lastDist) zoomAt((a.x + b.x) / 2, (a.y + b.y) / 2, d / lastDist);
    lastDist = d; moved = 99;
  }
});
const endPtr = e => { ptrs.delete(e.pointerId); lastDist = 0; };
window.addEventListener('pointerup', endPtr); window.addEventListener('pointercancel', endPtr);
vp.addEventListener('wheel', e => { e.preventDefault(); zoomAt(e.clientX, e.clientY, e.deltaY < 0 ? 1.1 : 0.9); }, { passive: false });
vp.addEventListener('click', e => { const b = e.target.closest('.card'); if (b && moved < 6) openDetail(b.dataset.id); });
const ctr = () => { const r = vp.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; };
$('#zIn').onclick = () => zoomAt(...ctr(), 1.25);
$('#zOut').onclick = () => zoomAt(...ctr(), 0.8);
$('#zFit').onclick = fit;
window.addEventListener('resize', () => { if (persons.length) applyView(); });

// ===== Wyszukiwarka =====
function focusPerson(id) {
  const q = last.pos.get(id); if (!q) return;
  view.k = 1; view.x = vp.clientWidth / 2 - (q.x + CARD_W / 2); view.y = vp.clientHeight / 2 - (q.y + CARD_H / 2);
  applyView(); openDetail(id);
}
$('#search').oninput = e => {
  const t = e.target.value.trim().toLowerCase(), box = $('#results');
  const list = t ? persons.filter(p => (name(p) + ' ' + (p.maiden_name || '')).toLowerCase().includes(t)).sort(byName).slice(0, 8) : [];
  box.classList.toggle('hidden', !list.length);
  box.innerHTML = list.map(p => `<button data-pick="${esc(p.id)}" class="block w-full text-left px-3 py-2 text-sm hover:bg-slate-50">${esc(name(p))} <span class="text-slate-400">${esc(years(p))}</span></button>`).join('');
};
$('#results').onclick = e => {
  const b = e.target.closest('[data-pick]'); if (!b) return;
  $('#results').classList.add('hidden'); $('#search').value = ''; focusPerson(b.dataset.pick);
};

// ===== Modal =====
function showModal(html) { $('#modalBody').innerHTML = html; $('#modal').classList.remove('hidden'); }
function closeModal() { $('#modal').classList.add('hidden'); }
$('#modal').addEventListener('mousedown', e => { if (e.target.id === 'modal') closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
$('#btnAdd').onclick = () => openForm();

// ===== Szczegóły osoby =====
function openDetail(id) {
  const p = byId.get(id); if (!p) return;
  const chip = q => `<button data-go="${esc(q.id)}" class="text-blue-600 hover:underline text-sm">${esc(name(q))}</button>`;
  const row = (l, v) => v ? `<div class="flex justify-between gap-4 text-sm py-1.5 border-b border-slate-100"><span class="text-slate-500">${l}</span><span class="text-right">${v}</span></div>` : '';
  const par = [p.father_id, p.mother_id].map(i => byId.get(i)).filter(Boolean);
  const pts = [...(last.partners.get(id) || [])].map(i => byId.get(i)).filter(Boolean);
  const kids = (children.get(id) || []).slice().sort(byBirth);
  const un = q => unions.find(u => (u.person_a === id && u.person_b === q.id) || (u.person_b === id && u.person_a === q.id));
  const ptsHtml = pts.map(q => chip(q) + (un(q) ? ` <button data-unlink="${esc(un(q).id)}" class="text-xs text-red-600 hover:underline">usuń</button>` : '')).join(', ');
  const others = persons.filter(q => q.id !== id && !pts.includes(q)).sort(byName);
  showModal(`
    <div class="flex items-start justify-between gap-3 mb-3">
      <div><h2 class="text-xl font-semibold">${esc(name(p))}</h2>${p.maiden_name ? `<p class="text-sm text-slate-500">z domu ${esc(p.maiden_name)}</p>` : ''}</div>
      <button data-close class="text-slate-400 hover:text-slate-600 text-xl leading-none">×</button>
    </div>
    <div class="mb-4">
      ${row('Płeć', p.gender === 'M' ? 'mężczyzna' : p.gender === 'K' ? 'kobieta' : '')}
      ${row('Data urodzenia', esc(p.birth_date))}${row('Miejsce urodzenia', esc(p.birth_place))}
      ${row('Data śmierci', esc(p.death_date))}${row('Miejsce śmierci', esc(p.death_place))}
      ${row('Rodzice', par.map(chip).join(', '))}${row('Partnerzy', ptsHtml)}${row('Dzieci', kids.map(chip).join(', '))}
    </div>
    ${p.notes ? `<p class="text-sm whitespace-pre-wrap bg-slate-50 border border-slate-200 rounded-lg p-3 mb-4">${esc(p.notes)}</p>` : ''}
    <div class="flex flex-wrap gap-2 mb-4">
      <button data-act="child" class="${BTN2}">+ Dziecko</button>
      <button data-act="partner" class="${BTN2}">+ Partner</button>
      ${par.length < 2 ? `<button data-act="parent" class="${BTN2}">+ Rodzic</button>` : ''}
    </div>
    ${others.length ? `<div class="flex gap-2 mb-4"><select id="linkSel" class="${INP}"><option value="">Powiąż z istniejącym partnerem…</option>${others.map(q => `<option value="${esc(q.id)}">${esc(name(q))} ${esc(years(q))}</option>`).join('')}</select><button data-act="link" class="${BTN2}">Powiąż</button></div>` : ''}
    <div class="flex justify-between gap-2 pt-4 border-t border-slate-200">
      <button data-act="del" class="${BTN_DEL}">Usuń</button>
      <div class="flex gap-2"><button data-close class="${BTN2}">Zamknij</button><button data-act="edit" class="${BTN}">Edytuj</button></div>
    </div>`);
  $('#modalBody').onclick = async e => {
    const t = e.target.closest('button'); if (!t) return;
    if (t.dataset.close !== undefined) return closeModal();
    if (t.dataset.go) return focusPerson(t.dataset.go);
    if (t.dataset.unlink) { await db.from('unions').delete().eq('id', t.dataset.unlink); await load(); return openDetail(id); }
    const a = t.dataset.act; if (!a) return;
    if (a === 'edit') openForm({ p });
    if (a === 'partner') openForm({ pre: {}, partnerOf: id });
    if (a === 'parent') openForm({ pre: { gender: p.father_id ? 'K' : 'M' }, parentOf: id });
    if (a === 'child') {
      const other = pts.length === 1 ? pts[0].id : null, pre = {};
      if (p.gender === 'K') { pre.mother_id = id; pre.father_id = other; } else { pre.father_id = id; pre.mother_id = other; }
      pre.last_name = byId.get(pre.father_id)?.last_name;
      openForm({ pre });
    }
    if (a === 'link') {
      const q = $('#linkSel').value; if (!q) return;
      const r = await db.from('unions').insert({ person_a: id, person_b: q });
      if (r.error) return setMsg(r.error.message);
      await load(); openDetail(id);
    }
    if (a === 'del') {
      if (!confirm(`Usunąć osobę: ${name(p)}? Powiązania z dziećmi i partnerami zostaną usunięte.`)) return;
      const r = await db.from('persons').delete().eq('id', id);
      if (r.error) return setMsg(r.error.message);
      closeModal(); await load();
    }
  };
}

// ===== Formularz =====
function openForm(o = {}) {
  const p = o.p || o.pre || {};
  const bad = o.p ? descendants(o.p.id).add(o.p.id) : new Set();
  const list = persons.filter(q => !bad.has(q.id)).sort(byName);
  const opt = (arr, sel) => '<option value="">— brak —</option>' + arr.map(q => `<option value="${esc(q.id)}"${q.id === sel ? ' selected' : ''}>${esc(name(q))} ${esc(years(q))}</option>`).join('');
  const inp = (l, n, ph = '') => `<label class="block"><span class="text-xs font-medium text-slate-600">${l}</span><input name="${n}" value="${esc(p[n])}" placeholder="${ph}" class="${INP}"></label>`;
  showModal(`
    <h2 class="text-lg font-semibold mb-4">${o.p ? 'Edytuj osobę' : 'Nowa osoba'}</h2>
    <form id="personForm" class="space-y-3">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        ${inp('Imię', 'first_name')}${inp('Nazwisko', 'last_name')}${inp('Nazwisko rodowe', 'maiden_name')}
        <label class="block"><span class="text-xs font-medium text-slate-600">Płeć</span>
          <select name="gender" class="${INP}"><option value="">—</option><option value="M"${p.gender === 'M' ? ' selected' : ''}>Mężczyzna</option><option value="K"${p.gender === 'K' ? ' selected' : ''}>Kobieta</option></select></label>
        ${inp('Data urodzenia', 'birth_date', 'RRRR lub RRRR-MM-DD')}${inp('Miejsce urodzenia', 'birth_place')}
        ${inp('Data śmierci', 'death_date', 'RRRR lub RRRR-MM-DD')}${inp('Miejsce śmierci', 'death_place')}
        <label class="block"><span class="text-xs font-medium text-slate-600">Ojciec</span><select name="father_id" class="${INP}">${opt(list.filter(q => q.gender !== 'K'), p.father_id)}</select></label>
        <label class="block"><span class="text-xs font-medium text-slate-600">Matka</span><select name="mother_id" class="${INP}">${opt(list.filter(q => q.gender !== 'M'), p.mother_id)}</select></label>
      </div>
      <label class="block"><span class="text-xs font-medium text-slate-600">Notatki</span><textarea name="notes" rows="3" class="${INP}">${esc(p.notes)}</textarea></label>
      <div class="flex justify-end gap-2 pt-2"><button type="button" data-close class="${BTN2}">Anuluj</button><button class="${BTN}">Zapisz</button></div>
    </form>`);
  $('#modalBody').onclick = e => { if (e.target.closest('[data-close]')) closeModal(); };
  $('#personForm').onsubmit = async e => {
    e.preventDefault();
    const d = {}; new FormData(e.target).forEach((v, k) => { d[k] = String(v).trim() || null; });
    const r = o.p ? await db.from('persons').update(d).eq('id', o.p.id).select().single()
                  : await db.from('persons').insert(d).select().single();
    if (r.error) return setMsg('Błąd zapisu: ' + r.error.message);
    if (o.partnerOf) await db.from('unions').insert({ person_a: o.partnerOf, person_b: r.data.id });
    if (o.parentOf) {
      const ch = byId.get(o.parentOf);
      const col = d.gender === 'K' ? 'mother_id' : d.gender === 'M' ? 'father_id' : (ch.father_id ? 'mother_id' : 'father_id');
      await db.from('persons').update({ [col]: r.data.id }).eq('id', o.parentOf);
    }
    closeModal(); await load();
  };
}
</script>
